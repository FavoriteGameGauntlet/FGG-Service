allOf:
  - $ref: "./PointChangeHistoryRow.yaml"
  - type: object
    properties:
      changeSource:
        enum: [ "wheel-effect", "quest", "base-teleport", "sandstorm", "other" ]
      changeDate:
        type: string
        format: date-time
      sourceLogin:
        nullable: true
        example: null
        allOf:
          - $ref: "./Login.yaml"
      wheelEffectName:
        nullable: true
        example: null
        allOf:
          - $ref: "./Name.yaml"
    required: [ changeDate ]
example:
  actualChangeValue: 2
  changeSource: quest
  desiredChangeValue: 2
  finalValue: 12
  changeDate: "2026-06-07T08:09:10.123Z"
