allOf:
  - $ref: "./PointChangeHistoryRow.yaml"
  - type: object
    properties:
      changeSource:
        enum: [ "territory-obtaining", "territory-loss", "other" ]
      changeDate:
        type: string
        format: date-time
      sourceLogin:
        nullable: true
        example: null
        allOf:
          - $ref: "./Login.yaml"
    required: [ changeDate ]
example:
  changeSource: territory-obtaining
  desiredChangeValue: 2
  actualChangeValue: 2
  finalValue: 12
  changeDate: "2026-06-07T08:09:10.123Z"