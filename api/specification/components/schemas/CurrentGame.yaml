type: object
properties:
  name:
    $ref: "./Name.yaml"
  state:
    type: string
    enum: [ "started", "finished", "cancelled" ]
  timeSpent:
    $ref: "./Duration.yaml"
  startDate:
    type: string
    format: date-time
  finishDate:
    type: string
    format: date-time
required: [ name, state, timeSpent, startDate ]