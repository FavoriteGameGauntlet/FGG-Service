services:
  postgres:
    image: postgres:17-alpine
    container_name: fgg-postgres
    environment:
      POSTGRES_DB: fgg
      POSTGRES_USER: fgg
      POSTGRES_PASSWORD: fgg
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  fgg:
    container_name: fgg-service
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: "postgres://fgg:fgg@postgres:5432/fgg"
    volumes:
      - ./logs:/app/logs
